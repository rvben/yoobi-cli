[package]
name = "yoobi-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Read, plan and verify Yoobi timesheet updates from the command line"
authors = ["Ruben J. Jongejan <ruben.jongejan@gmail.com>"]
license = "MIT"
repository = "https://github.com/rvben/yoobi-cli"
keywords = ["cli"]
categories = ["command-line-utilities"]
readme = "README.md"
include = ["/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/src/**", "/schemas/**", "/tests/**"]

[lib]
name = "yoobi_cli"
path = "src/lib.rs"

[[bin]]
name = "yoobi-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "cookies", "rustls-tls", "rustls-tls-native-roots"] }
scraper = "0.24"
regex = "1"
url = "2"
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
mockito = "1"
jsonschema = { version = "0.46", default-features = false }

[profile.release]
strip = true
lto = true
codegen-units = 1
